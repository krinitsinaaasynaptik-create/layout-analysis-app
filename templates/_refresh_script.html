<script>
  const refreshButton = document.getElementById('refreshButton');
  const refreshModal = document.getElementById('refreshModal');
  const refreshModalBackdrop = document.getElementById('refreshModalBackdrop');
  const refreshModalClose = document.getElementById('refreshModalClose');
  const objectivTokenInput = document.getElementById('objectivTokenInput');
  const ksmSessionInput = document.getElementById('ksmSessionInput');
  const refreshTargetButtons = Array.from(document.querySelectorAll('[data-refresh-developer]'));

  function notifyRefresh(message) {
    if (typeof showToast === 'function') {
      showToast(message);
      return;
    }
    const toast = document.getElementById('toast');
    if (toast) {
      toast.textContent = message;
      toast.hidden = false;
    }
  }

  function openRefreshModal() {
    if (!refreshModal) return;
    refreshModal.hidden = false;
  }

  function closeRefreshModal() {
    if (!refreshModal) return;
    refreshModal.hidden = true;
  }

  async function refreshDeveloper(button) {
    const developerId = button.dataset.refreshDeveloper;
    const developerName = button.dataset.refreshName || 'застройщик';
    const requiresToken = button.dataset.requiresToken === '1';
    const requiresKsmSession = button.dataset.requiresKsmSession === '1';
    if (requiresToken && objectivTokenInput && !objectivTokenInput.value.trim()) {
      objectivTokenInput.focus();
      notifyRefresh(`Для ${developerName} нужен токен Объектива.`);
      return;
    }
    if (requiresKsmSession && ksmSessionInput && !ksmSessionInput.value.trim()) {
      ksmSessionInput.focus();
      notifyRefresh(`Для ${developerName} нужна сессия кабинета КСМ.`);
      return;
    }
    button.disabled = true;
    const originalText = button.textContent;
    button.textContent = 'Обновляем...';
    notifyRefresh(`Обновляем ${developerName}. Это может занять несколько минут.`);
    try {
      const response = await fetch(`/api/refresh/${developerId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          objectiv_access_token: objectivTokenInput ? objectivTokenInput.value.trim() : '',
          ksm_session_id: ksmSessionInput ? ksmSessionInput.value.trim() : '',
        })
      });
      const payload = await response.json();
      notifyRefresh(payload.message || 'Готово');
      if (payload.ok) window.location.reload();
    } catch (error) {
      notifyRefresh(`Не удалось обновить ${developerName}.`);
    } finally {
      button.disabled = false;
      button.textContent = originalText;
    }
  }

  if (refreshButton && refreshModal) {
    refreshButton.addEventListener('click', () => {
      openRefreshModal();
      if (objectivTokenInput) objectivTokenInput.focus();
    });
    if (refreshModalBackdrop) refreshModalBackdrop.addEventListener('click', closeRefreshModal);
    if (refreshModalClose) refreshModalClose.addEventListener('click', closeRefreshModal);
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !refreshModal.hidden) closeRefreshModal();
    });
    refreshTargetButtons.forEach((button) => {
      button.addEventListener('click', async () => {
        if (refreshButton) refreshButton.disabled = true;
        await refreshDeveloper(button);
        if (refreshButton) refreshButton.disabled = false;
      });
    });
  }
</script>
